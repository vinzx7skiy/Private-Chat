<!DOCTYPE html>
<html>
<head>

  <title>Chat App</title>

  <link rel="stylesheet"
  href="style.css">

</head>
<body>

<div id="announcementBar"
class="announcement-bar">

 Announcement kosong

</div>

<div class="app">

  <div class="sidebar">

    <div class="top-sidebar">

      <h2>
        Chats
      </h2>

      <button onclick="openSettings()">
        ⚙️
      </button>

    </div>

    <div id="chatList">

      <div class="chat-item"
      onclick="openGlobalChat()">

        🌍 Global Chat

      </div>

    </div>

  </div>

  <div class="chat-area">

    <div class="chat-header">

      <div>

        <span id="chatUsername">

          Pilih Chat

        </span>

        <span id="badgeArea">

        </span>

      </div>

    </div>

    <div id="messages">

    </div>

    <div class="chat-input">

      <input
       type="text"
       id="messageInput"
       placeholder="Ketik pesan..."
      >

      <button onclick="sendMessage()">
        Kirim
      </button>

    </div>

  </div>

</div>

<div id="settingsPopup"
class="popup">

 <div class="popup-box">

  <h2>
    Menu
  </h2>

  <button onclick="addContact()">
    Tambahkan Kontak
  </button>

  <button onclick="createGroup()">
    Buat Grup
  </button>

  <button onclick="openProfile()">
    Profil
  </button>

  <button onclick="logout()">
    Logout
  </button>

 </div>

</div>

<div id="profilePopup"
class="popup">

 <div class="popup-box">

  <h2>
   Profile
  </h2>

  <p id="profileUsername">
  </p>

  <p id="profileCode">
  </p>

  <p id="profileRole">
  </p>

  <button onclick="changeUsername()">
   Ganti Username
  </button>

  <button onclick="changePassword()">
   Ganti Password
  </button>

  <button onclick="closeProfile()">
   Tutup
  </button>

 </div>

</div>

<script type="module"
src="firebase.js"></script>

<script type="module"
src="app.js"></script>

</body>
</html>
