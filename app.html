<!DOCTYPE html>
<html>
<head>

  <title>Chat App</title>

  <link rel="stylesheet"
  href="style.css">

</head>
<body>

<!-- ANNOUNCEMENT -->

<div id="announcementBar"
class="announcement-bar">

 Announcement kosong

</div>

<!-- APP -->

<div class="app">

  <!-- SIDEBAR -->

  <div class="sidebar">

    <div class="top-sidebar">

      <h2>
        Chats
      </h2>

      <button
      onclick="openSettings()">

        ⚙️

      </button>

    </div>

    <!-- CHAT LIST -->

    <div id="chatList">

    </div>

  </div>

  <!-- CHAT AREA -->

  <div class="chat-area">

    <!-- HEADER -->

    <div class="chat-header">

      <span id="chatUsername">

        Pilih Chat

      </span>

    </div>

    <!-- MESSAGES -->

    <div id="messages">

    </div>

    <!-- INPUT -->

    <div class="chat-input">

      <input
       type="text"
       id="messageInput"
       placeholder="Ketik pesan..."
      >

      <button
      onclick="sendMessage()">

        Kirim

      </button>

    </div>

  </div>

</div>

<!-- SETTINGS POPUP -->

<div id="settingsPopup"
class="popup">

 <div class="popup-box">

  <h2>
    Menu
  </h2>

  <button
  onclick="addContact()">

    Tambahkan Kontak

  </button>

  <button
  onclick="createGroup()">

    Buat Grup

  </button>

  <button
  onclick="openProfile()">

    Profil

  </button>

  <button
  onclick="closeSettings()">

    Tutup

  </button>

  <button
  onclick="logout()">

    Logout

  </button>

 </div>

</div>

<!-- PROFILE POPUP -->

<div id="profilePopup"
class="popup">

 <div class="popup-box">

  <h2>
   Profile
  </h2>

  <p id="profileUsername">
  </p>

  <p id="profileCode">
  </p>

  <p id="profileRole">
  </p>

  <button
  onclick="copyContactCode()">

   Copy Kode Kontak

  </button>

  <button
  onclick="changeUsername()">

   Ganti Username

  </button>

  <button
  onclick="changePassword()">

   Ganti Password

  </button>

  <button
  onclick="closeProfile()">

   Tutup

  </button>

 </div>

</div>

<script type="module"
src="firebase.js"></script>

<script type="module"
src="app.js"></script>

</body>
</html>
