<!DOCTYPE html>
<html>
<head>

  <title>Login Chat</title>

  <link rel="stylesheet"
  href="style.css">

</head>
<body>

<div class="login-box">

  <h1>
    CHAT APP
  </h1>

  <input
   type="email"
   id="email"
   placeholder="Email"
  >

  <input
   type="password"
   id="password"
   placeholder="Password"
  >

  <button onclick="login()">
    Login
  </button>

  <p>
    Belum punya akun?
    <a href="register.html">
      Register
    </a>
  </p>

</div>

<script type="module"
src="firebase.js"></script>

<script type="module"
src="auth.js"></script>

</body>
</html>
