<!DOCTYPE html>
<html>
<head>

  <title>Register</title>

  <link rel="stylesheet"
  href="style.css">

</head>
<body>

<div class="login-box">

  <h1>
    REGISTER
  </h1>

  <input
   type="text"
   id="username"
   placeholder="Username"
  >

  <input
   type="email"
   id="email"
   placeholder="Email"
  >

  <input
   type="password"
   id="password"
   placeholder="Password"
  >

  <button onclick="register()">
    Register
  </button>

</div>

<script type="module"
src="firebase.js"></script>

<script type="module"
src="auth.js"></script>

</body>
</html>
